<title>EENG250 Electric Circuits I</title>
<script>
  // GitHub Pages addresses are case-sensitive: /EENG250/ works, /eeng250 or /Eeng250 does not.
  // Any address that starts with the course code in the wrong case lands here and is sent on,
  // with the rest of the address in lower case (all page names on the site are lower case).
  var m = location.pathname.match(/^\/eeng250(\/.*)?$/i);
  if (m) {
    location.replace("/EENG250" + (m[1] ? m[1].toLowerCase() : "/") + location.search + location.hash);
  }
</script>
